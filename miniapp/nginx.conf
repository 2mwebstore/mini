# Static Mini App behind the main nginx (which routes /app/ here).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Behind TLS termination: never build redirects from this container's own http://host:port.
    absolute_redirect off;
    root /usr/share/nginx/html;

    # Content-hashed build output never changes.
    location /app/_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # SPA shell for every app route; always revalidated so a deploy reaches users at once.
    location /app/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()";
        # Telegram's mobile/desktop clients open the app in a web view; Telegram Web
        # (web.telegram.org) embeds it in an iframe, so only that origin may frame it.
        # 'unsafe-inline' scripts: Nuxt inlines its runtime config. Photos are blob: URLs.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors https://web.telegram.org; base-uri 'self'; form-action 'self'";
        try_files $uri /app/200.html;
    }

    location = /app { return 301 /app/; }
    location / { return 404; }
}
