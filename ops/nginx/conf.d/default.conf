# HTTP entrypoint. Telegram only opens Mini Apps over HTTPS: either terminate TLS in
# front of this (host Nginx + Certbot, Cloudflare) or enable ssl.conf.example here.
#   /app/    Telegram Mini App (employees)
#   /admin/  HR admin panel
#   /api/    Go API

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

upstream api { server api:8080; keepalive 16; }
upstream miniapp { server miniapp:8080; }
upstream admin { server admin:8080; }

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Certbot HTTP-01 challenges (when using ssl.conf)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location = /health { proxy_pass http://api/health; }

    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_read_timeout 120s;   # exports
    }

    # Mini App check-in/out photo uploads (the app downsizes to ~1 MB; the API caps at 8 MB).
    location ~ ^/api/v1/app/attendance/check-(in|out)$ {
        client_max_body_size 9m;
        proxy_pass http://api;
    }

    # Static front ends.
    location /app/ { proxy_pass http://miniapp; }
    location = /app { absolute_redirect off; return 301 /app/; }
    location /admin/ { proxy_pass http://admin; }
    location = /admin { absolute_redirect off; return 301 /admin/; }
    location = / { absolute_redirect off; return 302 /admin/; }

    location / { return 404; }
}
