# Static admin panel behind the main nginx (which routes /admin/ here).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Behind TLS termination: never build redirects from this container's own http://host:port.
    absolute_redirect off;
    root /usr/share/nginx/html;

    # Content-hashed build output never changes.
    location /admin/_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # SPA shell for every route; always revalidated so a deploy reaches users at once.
    location /admin/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy same-origin;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
        # Same-origin only; no third-party scripts. 'unsafe-inline' scripts: Nuxt inlines its runtime config.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
        try_files $uri /admin/200.html;
    }

    location = /admin { return 301 /admin/; }
    location / { return 404; }
}
